<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ff4f81">
  <title>今日のリスト</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <button id="prev" class="nav" aria-label="前の日">‹</button>
      <div class="date">
        <p class="kicker" id="kicker">✨ TODAY'S LIST ✨</p>
        <h1 id="dateLabel"></h1>
        <button id="today" class="today" hidden>今日に戻る</button>
      </div>
      <button id="next" class="nav" aria-label="次の日">›</button>
    </div>
  </header>

  <main class="app">
    <section class="weather-wrap" aria-label="天気">
      <div id="weather" class="weather" hidden></div>
      <div id="weatherDetail" class="detail" hidden></div>
    </section>

    <section class="panel">
      <div class="progress" aria-live="polite">
        <div class="bar"><span id="barFill"></span></div>
        <p id="progressText"></p>
      </div>

      <form id="addForm" class="add">
        <input id="addInput" type="text" maxlength="200" placeholder="やりたいことを入れよう 🔥" autocomplete="off" required>
        <button type="submit">追加 ＋</button>
      </form>

      <ul id="list" class="list"></ul>
      <p id="empty" class="empty" hidden>🌈 まっさらな1日！最初の1つを入れてみよう</p>
      <button id="carry" class="carry" hidden></button>
    </section>

    <section id="newsBox" class="news">
      <div class="news-head">
        <h2>📰 気になるニュース</h2>
        <span id="newsUpdated" class="updated"></span>
        <button id="newsRefresh" class="refresh" aria-label="ニュースを更新">↻</button>
      </div>
      <div id="newsTabs" class="tabs" role="tablist">
        <button role="tab" data-cat="entertainment" aria-selected="true">🎬 エンタメ</button>
        <button role="tab" data-cat="it" aria-selected="false">💻 IT</button>
        <button role="tab" data-cat="business" aria-selected="false">📈 政治・経済</button>
        <button role="tab" data-cat="love" aria-selected="false">💘 恋愛</button>
      </div>
      <ul id="news"></ul>
      <p id="newsMsg" class="empty" hidden></p>
    </section>

    <p id="error" class="error" role="alert" hidden></p>
  </main>
  <div id="fx" aria-hidden="true"></div>
  <script src="app.js"></script>
</body>
</html>
