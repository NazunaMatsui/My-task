<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#3f35a5">
  <title>今日のリスト</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233f35a5'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="side" aria-label="メニュー">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M6 12.5l4 4L18 8" /></svg>
    </div>
    <button class="side-btn active" data-target="top" title="ホーム" aria-label="ホーム">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
    </button>
    <button class="side-btn" data-target="sec-tasks" title="やること" aria-label="やること">
      <svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/></svg>
    </button>
    <button class="side-btn" data-target="sec-cal" title="カレンダー" aria-label="カレンダー">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    </button>
    <button class="side-btn" data-target="sec-weather" title="天気" aria-label="天気">
      <svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7 9.5 4.25 4.25 0 0 0 7 18z"/></svg>
    </button>
    <button class="side-btn" data-target="sec-news" title="ニュース" aria-label="ニュース">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
    </button>
  </nav>

  <div class="wrap" id="top">
    <header class="topbar">
      <div class="when">
        <button id="prev" class="nav" aria-label="前の日">‹</button>
        <div class="date">
          <p class="kicker" id="kicker">TODAY</p>
          <h1 id="dateLabel"></h1>
        </div>
        <button id="next" class="nav" aria-label="次の日">›</button>
        <button id="today" class="today" hidden>今日へ戻る</button>
      </div>
      <div class="search">
        <input id="searchInput" type="search" placeholder="タスクを検索" autocomplete="off" aria-label="タスクを検索">
        <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <ul id="searchResults" class="search-results" hidden></ul>
      </div>
    </header>

    <main class="grid">
      <section class="card stats" id="sec-stats" aria-label="今日の数字">
        <div class="stat">
          <span class="arrow up">↑</span>
          <div><b id="statDone">0</b><small>完了</small></div>
        </div>
        <hr>
        <div class="stat">
          <span class="arrow down">↓</span>
          <div><b id="statLeft">0</b><small>のこり</small></div>
        </div>
      </section>

      <section class="card cal" id="sec-cal" aria-label="カレンダー">
        <div class="cal-head">
          <button id="calPrev" class="mini" aria-label="前の月">‹</button>
          <b id="calTitle"></b>
          <button id="calNext" class="mini" aria-label="次の月">›</button>
        </div>
        <div id="calGrid" class="cal-grid"></div>
      </section>

      <section class="card ring-card" id="sec-ring" aria-label="達成率">
        <h2>達成率</h2>
        <div class="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="50"/>
            <circle id="ringFg" class="ring-fg" cx="60" cy="60" r="50" transform="rotate(-90 60 60)"/>
          </svg>
          <div class="ring-num"><b id="ringPct">0%</b></div>
        </div>
        <p id="progressText" class="ring-msg" aria-live="polite"></p>
      </section>

      <section class="card tasks" id="sec-tasks" aria-label="今日のタスク">
        <h2>やること</h2>
        <form id="addForm" class="add">
          <input id="addInput" type="text" maxlength="200" placeholder="やることを入力" autocomplete="off" required>
          <button type="submit">追加</button>
        </form>
        <ul id="list" class="list"></ul>
        <p id="empty" class="empty" hidden>まだタスクがありません。最初の1件を追加しましょう。</p>
        <button id="carry" class="carry" hidden></button>
        <p id="error" class="error" role="alert" hidden></p>
      </section>

      <section class="card week" id="sec-week" aria-label="週間グラフ">
        <h2>この1週間</h2>
        <svg id="weekChart" viewBox="0 0 300 170" role="img" aria-label="直近7日間のタスク数と完了数"></svg>
        <div class="legend"><span><i class="sw all"></i>全体</span><span><i class="sw dn"></i>完了</span></div>
      </section>

      <section class="card weather-card" id="sec-weather" aria-label="天気">
        <h2>今日の天気</h2>
        <div id="weather" class="weather" hidden></div>
        <div id="weatherDetail" class="detail" hidden></div>
      </section>

      <section class="card news" id="sec-news">
        <div class="news-head">
          <h2>ニュース</h2>
          <span id="newsUpdated" class="updated"></span>
          <button id="newsRefresh" class="refresh" aria-label="ニュースを更新">
            <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg>
          </button>
        </div>
        <div id="newsTabs" class="tabs" role="tablist">
          <button role="tab" data-cat="entertainment" aria-selected="true">エンタメ</button>
          <button role="tab" data-cat="it" aria-selected="false">IT</button>
          <button role="tab" data-cat="business" aria-selected="false">政治・経済</button>
          <button role="tab" data-cat="love" aria-selected="false">恋愛</button>
        </div>
        <ul id="news"></ul>
        <p id="newsMsg" class="empty" hidden></p>
      </section>
    </main>
  </div>
  <div id="fx" aria-hidden="true"></div>
  <script src="app.js"></script>
</body>
</html>
