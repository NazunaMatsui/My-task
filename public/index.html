<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#5b4fd6">
  <title>今日のリスト</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="side" aria-label="メニュー">
    <div class="avatar" title="今日のリスト">✨</div>
    <button class="side-btn active" data-target="top" title="ホーム" aria-label="ホーム">🏠</button>
    <button class="side-btn" data-target="sec-tasks" title="今日のリスト" aria-label="今日のリスト">✅</button>
    <button class="side-btn" data-target="sec-cal" title="カレンダー" aria-label="カレンダー">📅</button>
    <button class="side-btn" data-target="sec-weather" title="天気" aria-label="天気">⛅</button>
    <button class="side-btn" data-target="sec-news" title="ニュース" aria-label="ニュース">📰</button>
  </nav>

  <div class="wrap" id="top">
    <header class="topbar">
      <div class="when">
        <button id="prev" class="nav" aria-label="前の日">‹</button>
        <div class="date">
          <p class="kicker" id="kicker">✨ TODAY'S LIST ✨</p>
          <h1 id="dateLabel"></h1>
        </div>
        <button id="next" class="nav" aria-label="次の日">›</button>
        <button id="today" class="today" hidden>今日へ</button>
      </div>
      <div class="search">
        <input id="searchInput" type="search" placeholder="タスクを検索…" autocomplete="off" aria-label="タスクを検索">
        <span class="search-ico" aria-hidden="true">🔍</span>
        <ul id="searchResults" class="search-results" hidden></ul>
      </div>
    </header>

    <main class="grid">
      <section class="card stats" id="sec-stats" aria-label="今日の数字">
        <div class="stat">
          <span class="arrow up">↑</span>
          <div><b id="statDone">0</b><small>完了したこと</small></div>
        </div>
        <hr>
        <div class="stat">
          <span class="arrow down">↓</span>
          <div><b id="statLeft">0</b><small>のこり</small></div>
        </div>
      </section>

      <section class="card cal" id="sec-cal" aria-label="カレンダー">
        <div class="cal-head">
          <button id="calPrev" class="mini" aria-label="前の月">‹</button>
          <b id="calTitle"></b>
          <button id="calNext" class="mini" aria-label="次の月">›</button>
        </div>
        <div id="calGrid" class="cal-grid"></div>
      </section>

      <section class="card ring-card" id="sec-ring" aria-label="達成率">
        <h2>🎯 達成率</h2>
        <div class="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#8b7cf6"/><stop offset="1" stop-color="#f2905b"/>
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="60" cy="60" r="50"/>
            <circle id="ringFg" class="ring-fg" cx="60" cy="60" r="50" transform="rotate(-90 60 60)"/>
          </svg>
          <div class="ring-num"><b id="ringPct">0%</b></div>
        </div>
        <p id="progressText" class="ring-msg" aria-live="polite"></p>
      </section>

      <section class="card tasks" id="sec-tasks" aria-label="今日のタスク">
        <h2>✅ やること</h2>
        <form id="addForm" class="add">
          <input id="addInput" type="text" maxlength="200" placeholder="やりたいことを入れよう 🔥" autocomplete="off" required>
          <button type="submit">追加 ＋</button>
        </form>
        <ul id="list" class="list"></ul>
        <p id="empty" class="empty" hidden>🌈 まっさらな1日！最初の1つを入れてみよう</p>
        <button id="carry" class="carry" hidden></button>
        <p id="error" class="error" role="alert" hidden></p>
      </section>

      <section class="card week" id="sec-week" aria-label="週間グラフ">
        <h2>📊 この1週間</h2>
        <svg id="weekChart" viewBox="0 0 300 170" role="img" aria-label="直近7日間のタスク数と完了数"></svg>
        <div class="legend"><span><i class="sw all"></i>全部</span><span><i class="sw dn"></i>完了</span></div>
      </section>

      <section class="card weather-card" id="sec-weather" aria-label="天気">
        <h2>⛅ 今日の天気</h2>
        <div id="weather" class="weather" hidden></div>
        <div id="weatherDetail" class="detail" hidden></div>
      </section>

      <section class="card news" id="sec-news">
        <div class="news-head">
          <h2>📰 気になるニュース</h2>
          <span id="newsUpdated" class="updated"></span>
          <button id="newsRefresh" class="refresh" aria-label="ニュースを更新">↻</button>
        </div>
        <div id="newsTabs" class="tabs" role="tablist">
          <button role="tab" data-cat="entertainment" aria-selected="true">🎬 エンタメ</button>
          <button role="tab" data-cat="it" aria-selected="false">💻 IT</button>
          <button role="tab" data-cat="business" aria-selected="false">📈 政治・経済</button>
          <button role="tab" data-cat="love" aria-selected="false">💘 恋愛</button>
        </div>
        <ul id="news"></ul>
        <p id="newsMsg" class="empty" hidden></p>
      </section>
    </main>
  </div>
  <div id="fx" aria-hidden="true"></div>
  <script src="app.js"></script>
</body>
</html>
